[log]
mode = "json"

[shared]
gatewaysvc = "{{cesnetgw_address}}"

[http]
address = "{{grpc_address}}"

[http.services.ocmd]

[http.services.sciencemesh]
provider_domain = "{{cesnethttp_address}}"
mesh_directory_url = "http://meshdir"
smtp_credentials = {}

[http.middlewares.cors]

[http.middlewares.providerauthorizer]
driver = "json"

[http.middlewares.providerauthorizer.drivers.json]
providers = "fixtures/ocm-providers.demo.json"

[http.services.datagateway]

[http.services.dataprovider]
driver = "ocmreceived"
# shared with the storageprovider in cesnetgw, which creates the upload sessions
upload_directory = "{{cesnetgw_root}}/uploads"

[http.services.dataprovider.drivers.ocmreceived]
service_account_id = "ocm-sa"
service_account_secret = "ocm-sa-secret"
