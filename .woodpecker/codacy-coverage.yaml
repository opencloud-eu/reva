variables:
  - &codacy_image 'codacy/codacy-coverage-reporter:14.1.3'
  - &status
    - success
    - failure

# unit-test and test-integration upload their coverage as partial reports in
# parallel, Codacy combines them when this workflow sends the final report
when:
  - event:
      - push
      - manual
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}
      - feature/*
    status: *status
  - event: cron
    cron: nightly
    status: *status
  - event: pull_request
    evaluate: |
      !(CI_COMMIT_SOURCE_BRANCH matches "next-release/(main|stable-*)" && CI_COMMIT_AUTHOR == "openclouders")
    status: *status

depends_on:
  - unit-test
  - test-integration

steps:
  - name: codacy-coverage-final
    image: *codacy_image
    environment:
      CODACY_API_TOKEN:
        from_secret: codacy_api_token
      CODACY_ORGANIZATION_PROVIDER: gh
      CODACY_USERNAME: opencloud-eu
      CODACY_PROJECT_NAME: reva
    commands:
      # also when a test workflow failed, Codacy waits for the final report otherwise
      - /app/codacy-coverage-reporter final
