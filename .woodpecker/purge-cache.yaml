variables:
  - &s3_cache_image 'plugins/s3-cache:1'

when:
  - event: cron
    cron: purge-cache

skip_clone: true

steps:
  - name: purge
    image: *s3_cache_image
    settings:
      access_key:
        from_secret: cache_s3_access_key
      endpoint: 'https://s3.ci.opencloud.eu'
      flush: true
      flush_age: 1
      flush_path: dev/${CI_REPO}/
      secret_key:
        from_secret: cache_s3_secret_key
