variables:
  - &golang_image 'docker.io/golang:1.26'
  - &codacy_image 'codacy/codacy-coverage-reporter:14.1.3'
  - &codacy_environment
    CODACY_API_TOKEN:
      from_secret: codacy_api_token
    CODACY_ORGANIZATION_PROVIDER: gh
    CODACY_USERNAME: opencloud-eu
    CODACY_PROJECT_NAME: reva

when:
  - event:
      - push
      - manual
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}
      - feature/*
  - event: pull_request
  - event: cron
    cron: nightly

depends_on:
  - build
  - unit-test # sends its coverage first, this workflow sends the final report

workspace:
  base: /go # use the go home dir as workspace to share go packages, see https://woodpecker-ci.org/docs/usage/workflow-syntax#workspace

steps:
  - name: build-revad
    image: *golang_image
    environment:
      HTTP_PROXY:
        from_secret: ci_http_proxy
      HTTPS_PROXY:
        from_secret: ci_http_proxy
    commands:
      # a coverage build, revad writes what the tests cover into GOCOVERDIR when it stops
      - go build -cover -coverpkg=github.com/opencloud-eu/reva/v3/... -o ./cmd/revad/revad ./cmd/revad

  - name: test-integration
    image: *golang_image
    environment:
      HTTP_PROXY:
        from_secret: ci_http_proxy
      HTTPS_PROXY:
        from_secret: ci_http_proxy
    commands:
      - export GOCOVERDIR=$CI_WORKSPACE/covdata && mkdir -p $GOCOVERDIR
      - cd tests/integration && go test -race ./... -timeout 15m
      - cd $CI_WORKSPACE && go tool covdata textfmt -i=covdata -o integration.coverage.out
      # mocks, generated and example code are not part of the coverage
      - grep -v -E '/mocks/|/cs3mocks/|\.pb\.go:|/examples/|/tools/' integration.coverage.out > integration.codacy.out

  - name: codacy-coverage
    image: *codacy_image
    environment: *codacy_environment
    commands:
      - /app/codacy-coverage-reporter report --partial --force-coverage-parser go -r integration.codacy.out

  - name: codacy-coverage-final
    image: *codacy_image
    environment: *codacy_environment
    commands:
      # also without the integration coverage, Codacy waits for it otherwise
      - /app/codacy-coverage-reporter final
    when:
      - status:
          - success
          - failure
