variables:
  - &golang_image 'docker.io/golang:1.26'
  - &codacy_image 'codacy/codacy-coverage-reporter:14.1.3'

when:
  - event:
      - push
      - manual
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}
      - feature/*
  - event: cron
    cron: nightly
  - event: pull_request
    evaluate: |
      !(CI_COMMIT_SOURCE_BRANCH matches "next-release/(main|stable-*)" && CI_COMMIT_AUTHOR == "openclouders")

workspace:
  base: /go # use the go home dir as workspace to share go packages, see https://woodpecker-ci.org/docs/usage/workflow-syntax#workspace

steps:
  - name: test
    image: *golang_image
    environment:
      HTTP_PROXY:
        from_secret: ci_http_proxy
      HTTPS_PROXY:
        from_secret: ci_http_proxy
    commands:
      - apt-get update -qq && apt-get install -y inotify-tools
      - make test
      # mocks, generated and example code are not part of the coverage
      - grep -v -E '/mocks/|/cs3mocks/|\.pb\.go:|/examples/|/tools/' coverage.out > coverage.codacy.out

  - name: codacy-coverage
    image: *codacy_image
    environment:
      CODACY_API_TOKEN:
        from_secret: codacy_api_token
      CODACY_ORGANIZATION_PROVIDER: gh
      CODACY_USERNAME: opencloud-eu
      CODACY_PROJECT_NAME: reva
    commands:
      # partial, test-integration adds its coverage and sends the final report
      - /app/codacy-coverage-reporter report --partial --force-coverage-parser go -r coverage.codacy.out
